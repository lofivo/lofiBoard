# 推荐生产配置：Nginx 直接托管 Vite 构建后的 dist/ 静态文件。
# 用法：
# 1. 先在项目目录执行：npm ci && npm run build
# 2. 将 dist/ 同步到 /var/www/lofibrd/dist
# 3. 修改 server_name 后，将本文件软链到 /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name board.example.com;

    root /var/www/lofibrd/dist;
    index index.html;

    # Vite 构建产物带 hash，可以长期缓存。
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 应用入口不要强缓存，发布新版后浏览器能尽快拿到新的资源表。
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
